name: TryHackme Badge Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  updatebadge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: getbadge
        run: curl -L -H "User-Agent:Mozilla/5.0" -H "Referer:https://tryhackme.com/" https://tryhackme-badges.s3.amazonaws.com/fwiygul07.png -o thm-badge.png

      - name: commitandpush
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add thm-badge.png
          git commit -m "Update TryHackMe Badge" || exit 0
          git push
