name: TryHackme Badge Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  updatebadge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download badge
        run: |
          curl -fL -H "User-Agent: Mozilla/5.0" \
               -H "Referer: https://tryhackme.com/" \
               https://tryhackme-badges.s3.amazonaws.com/fwiygul07.png \
               -o thm-badge.png

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update TryHackMe Badge"
          file_pattern: "thm-badge.png"
